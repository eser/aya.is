# Integrity checks (Node.js + pnpm for the project, Deno only hosts the eser CLI)
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Integrity Pipeline

on:
  push:
    branches:
      - "**"
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*

  pull_request:
    types:
      - opened
      - edited # in case of base branch change
      - synchronize
      # - reopened
      # - ready_for_review
    branches:
      - "**"

  # schedule:
  #   - cron: "18 21 * * 6"

  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:
    inputs:
      run_checks:
        description: Run integrity checks
        required: false
        type: boolean

concurrency:
  group: ${{ github.ref }}-integrity
  cancel-in-progress: true

jobs:
  integration:
    name: Integration
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    permissions:
      contents: read # Needed to clone the repository

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # - windows-latest
          # - macOS-latest
        deno-version: # only used to install the eser CLI, which is published on JSR
          - 2.9.5
        node-version:
          - 24
        golang-version:
          - 1.27.4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Deno ${{ matrix.deno-version }} (eser CLI host)
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno-version }}

      - name: Setup Golang ${{ matrix.golang-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.golang-version }}
          cache: true
          cache-dependency-path: ./apps/services/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install eser CLI
        run: deno install -gAf --name eser jsr:@eser/cli

      - name: Run integrity checks
        run: eser ok

      - name: Build services
        working-directory: ./apps/services/
        run: go build -v ./...

      # - name: Generate webclient coverage report
      #   run: pnpm --filter @aya/webclient test:coverage-gen

